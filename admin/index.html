<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LLM Controller</title>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    <style>
        select.value {
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
            width: 100%;
            height: 35px;
            margin: 5px 0;
            border: 2px solid #333;
            background: #fff;
            font-size: 14px;
        }
        .select-wrapper { display: none !important; }
        .my-row { margin-bottom: 15px; overflow: hidden; }
        .my-col-6 { float: left; width: 48%; margin-right: 2%; }
        .my-col-4 { float: left; width: 31%; margin-right: 2%; }
        .my-col-12 { width: 100%; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input.value, textarea.value {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        h4 { color: #1976d2; border-bottom: 2px solid #1976d2; padding-bottom: 10px; }
        h5 { color: #555; margin-top: 20px; }
        .checkbox-label { display: inline; font-weight: normal; }
    </style>
    <script type="text/javascript">
        // Model definitions
        var MODELS = {
            claude: [
                ['claude-sonnet-4-20250514', 'Claude Sonnet 4'],
                ['claude-opus-4-20250514', 'Claude Opus 4'],
                ['claude-3-5-haiku-20241022', 'Claude 3.5 Haiku']
            ],
            openai: [
                ['gpt-4o', 'GPT-4o'],
                ['gpt-4o-mini', 'GPT-4o Mini'],
                ['gpt-4-turbo', 'GPT-4 Turbo'],
                ['gpt-3.5-turbo', 'GPT-3.5 Turbo']
            ],
            gemini: [
                ['gemini-2.5-pro', 'Gemini 2.5 Pro'],
                ['gemini-1.5-pro', 'Gemini 1.5 Pro'],
                ['gemini-1.5-flash', 'Gemini 1.5 Flash']
            ],
            kimi: [
                ['kimi-k2-5', 'Kimi K2.5'],
                ['kimi-k1-5', 'Kimi K1.5']
            ]
        };

        function load(settings, onChange) {
            if (!settings) return;

            // Set provider
            var provider = settings.llmProvider || 'claude';
            document.getElementById('llmProvider').value = provider;
            
            // Set models for provider
            updateModels(provider, settings.model);
            
            // Text fields
            document.getElementById('apiKey').value = settings.apiKey || '';
            document.getElementById('maxTokens').value = settings.maxTokens || 1024;
            document.getElementById('commandTimeout').value = settings.commandTimeout || 30;
            document.getElementById('confidenceThreshold').value = settings.confidenceThreshold || 0.5;
            document.getElementById('deviceCacheMinutes').value = settings.deviceCacheMinutes || 5;
            document.getElementById('debounceMs').value = settings.debounceMs || 500;
            document.getElementById('allowedRooms').value = settings.allowedRooms || '';
            document.getElementById('systemPrompt').value = settings.systemPrompt || '';
            document.getElementById('confirmActions').checked = settings.confirmActions || false;
            
            if (settings.triggerWords && Array.isArray(settings.triggerWords)) {
                document.getElementById('triggerWords').value = settings.triggerWords.join(', ');
            }

            // Load Alexa instances
            loadAlexaInstances(settings.alexa2Instances || ['alexa2.0']);

            // IMPORTANT: Bind change event to provider
            document.getElementById('llmProvider').addEventListener('change', function() {
                console.log('Provider changed to:', this.value);
                updateModels(this.value);
                onChange();
            });

            // Bind change to all inputs
            var inputs = document.querySelectorAll('.value');
            for (var i = 0; i < inputs.length; i++) {
                inputs[i].addEventListener('change', function() { onChange(); });
            }

            onChange(false);
        }

        function updateModels(provider, selectedModel) {
            console.log('updateModels called with:', provider, selectedModel);
            
            var modelList = MODELS[provider] || MODELS.claude;
            var select = document.getElementById('model');
            
            // Clear current options
            select.innerHTML = '';
            
            // Add new options
            for (var i = 0; i < modelList.length; i++) {
                var option = document.createElement('option');
                option.value = modelList[i][0];
                option.text = modelList[i][1];
                
                // Select if matches or if first and no selection
                if (selectedModel && modelList[i][0] === selectedModel) {
                    option.selected = true;
                } else if (!selectedModel && i === 0) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            }
            
            console.log('Models updated, count:', modelList.length);
        }

        function loadAlexaInstances(selected) {
            socket.emit('getObjectView', 'system', 'instance', {
                startkey: 'system.adapter.alexa2.',
                endkey: 'system.adapter.alexa2.\u9999'
            }, function(err, res) {
                var select = document.getElementById('alexa2Instances');
                select.innerHTML = '';
                
                if (!err && res && res.rows && res.rows.length > 0) {
                    for (var i = 0; i < res.rows.length; i++) {
                        var inst = res.rows[i].id.replace('system.adapter.', '');
                        var option = document.createElement('option');
                        option.value = inst;
                        option.text = inst;
                        if (selected && selected.indexOf(inst) >= 0) option.selected = true;
                        select.appendChild(option);
                    }
                } else {
                    var option = document.createElement('option');
                    option.value = 'alexa2.0';
                    option.text = 'alexa2.0';
                    option.selected = true;
                    select.appendChild(option);
                }
            });
        }

        function save(callback) {
            var obj = {};
            obj.llmProvider = document.getElementById('llmProvider').value;
            obj.model = document.getElementById('model').value;
            obj.apiKey = document.getElementById('apiKey').value;
            obj.maxTokens = parseInt(document.getElementById('maxTokens').value) || 1024;
            obj.commandTimeout = parseInt(document.getElementById('commandTimeout').value) || 30;
            obj.deviceCacheMinutes = parseInt(document.getElementById('deviceCacheMinutes').value) || 5;
            obj.debounceMs = parseInt(document.getElementById('debounceMs').value) || 500;
            obj.confidenceThreshold = parseFloat(document.getElementById('confidenceThreshold').value) || 0.5;
            obj.allowedRooms = document.getElementById('allowedRooms').value || '';
            obj.systemPrompt = document.getElementById('systemPrompt').value || '';
            obj.confirmActions = document.getElementById('confirmActions').checked;
            
            var sel = document.getElementById('alexa2Instances');
            var arr = [];
            for (var i = 0; i < sel.options.length; i++) {
                if (sel.options[i].selected) arr.push(sel.options[i].value);
            }
            obj.alexa2Instances = arr.length > 0 ? arr : ['alexa2.0'];
            
            var tw = document.getElementById('triggerWords').value;
            obj.triggerWords = tw ? tw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }) : [];

            callback(obj);
        }
    </script>
</head>
<body>
    <div class="m adapter-container" style="padding: 20px;">
        <h4>LLM Controller</h4>

        <h5>LLM Provider</h5>
        <div class="my-row">
            <div class="my-col-6">
                <label for="llmProvider">Provider</label>
                <select id="llmProvider" class="value">
                    <option value="claude">Anthropic Claude</option>
                    <option value="openai">OpenAI (ChatGPT)</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="kimi">Kimi (Moonshot)</option>
                </select>
            </div>
            <div class="my-col-6">
                <label for="model">Modell</label>
                <select id="model" class="value"></select>
            </div>
        </div>

        <h5>API Konfiguration</h5>
        <div class="my-row">
            <div class="my-col-6">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" class="value">
            </div>
            <div class="my-col-6">
                <label for="maxTokens">Max Tokens</label>
                <input type="number" id="maxTokens" class="value" value="1024" min="256" max="4096">
            </div>
        </div>

        <div class="my-row">
            <div class="my-col-4">
                <label for="commandTimeout">Timeout (Sek)</label>
                <input type="number" id="commandTimeout" class="value" value="30" min="5" max="120">
            </div>
            <div class="my-col-4">
                <label for="confidenceThreshold">Min. Konfidenz</label>
                <input type="number" id="confidenceThreshold" class="value" value="0.5" min="0" max="1" step="0.1">
            </div>
            <div class="my-col-4">
                <label for="debounceMs">Debounce (ms)</label>
                <input type="number" id="debounceMs" class="value" value="500" min="0" max="5000" step="100">
            </div>
        </div>

        <h5>Alexa Integration</h5>
        <div class="my-row">
            <div class="my-col-6">
                <label for="alexa2Instances">Alexa2 Instanzen (Strg+Klick für Mehrere)</label>
                <select id="alexa2Instances" class="value" multiple size="3">
                    <option value="alexa2.0">alexa2.0</option>
                </select>
            </div>
            <div class="my-col-6">
                <label for="triggerWords">Trigger-Wörter (kommagetrennt)</label>
                <input type="text" id="triggerWords" class="value">
            </div>
        </div>

        <h5>Gerätesteuerung</h5>
        <div class="my-row">
            <div class="my-col-4">
                <label for="allowedRooms">Erlaubte Räume</label>
                <input type="text" id="allowedRooms" class="value">
            </div>
            <div class="my-col-4">
                <label for="deviceCacheMinutes">Cache (Min)</label>
                <input type="number" id="deviceCacheMinutes" class="value" value="5" min="1" max="60">
            </div>
            <div class="my-col-4" style="padding-top: 25px;">
                <input type="checkbox" id="confirmActions" class="value">
                <label for="confirmActions" class="checkbox-label">Konfidenz bestätigen</label>
            </div>
        </div>

        <h5>System Prompt (Optional)</h5>
        <div class="my-row">
            <div class="my-col-12">
                <label for="systemPrompt">Zusätzlicher Prompt</label>
                <textarea id="systemPrompt" class="value" rows="4"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
