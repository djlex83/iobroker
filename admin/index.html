<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LLM Controller</title>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    <style>
        select { 
            display: block; 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            background: white;
            font-size: 14px;
            margin-top: 20px;
        }
        select[multiple] { height: auto; min-height: 80px; }
        .input-field { margin-bottom: 20px; }
        label { 
            display: block; 
            font-weight: bold; 
            color: #555;
            margin-bottom: 5px;
        }
        h4 { color: #1976d2; border-bottom: 2px solid #1976d2; padding-bottom: 10px; }
        h5 { color: #555; margin-top: 30px; }
    </style>
    <script type="text/javascript">
        console.log('=== ADMIN PAGE LOADED ===');
        
        function load(settings, onChange) {
            console.log('=== LOAD CALLED ===', settings);
            
            if (!settings) {
                console.error('NO SETTINGS!');
                return;
            }

            try {
                // Provider setzen
                var provider = settings.llmProvider || 'claude';
                $('#llmProvider').val(provider);
                
                // Models laden
                updateModels(provider, settings.model);
                
                // Text Felder
                $('#apiKey').val(settings.apiKey || '');
                $('#maxTokens').val(settings.maxTokens || 1024);
                $('#commandTimeout').val(settings.commandTimeout || 30);
                $('#confidenceThreshold').val(settings.confidenceThreshold || 0.5);
                $('#deviceCacheMinutes').val(settings.deviceCacheMinutes || 5);
                $('#debounceMs').val(settings.debounceMs || 500);
                $('#allowedRooms').val(settings.allowedRooms || '');
                $('#systemPrompt').val(settings.systemPrompt || '');
                $('#confirmActions').prop('checked', settings.confirmActions || false);
                
                if (settings.triggerWords && Array.isArray(settings.triggerWords)) {
                    $('#triggerWords').val(settings.triggerWords.join(', '));
                }

                // Alexa Instanzen
                loadAlexaInstances(settings.alexa2Instances || ['alexa2.0']);

                // Event Handler
                $('#llmProvider').on('change', function() {
                    updateModels($(this).val());
                    onChange();
                });

                $('.value').on('change', function() {
                    onChange();
                });

                onChange(false);
                console.log('=== LOAD COMPLETE ===');
                
            } catch(e) {
                console.error('LOAD ERROR:', e);
                alert('Fehler beim Laden: ' + e.message);
            }
        }

        function updateModels(provider, selectedModel) {
            console.log('updateModels:', provider, selectedModel);
            
            var models = {
                claude: [
                    {id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4'},
                    {id: 'claude-opus-4-20250514', name: 'Claude Opus 4'},
                    {id: 'claude-3-5-haiku-20241022', name: 'Claude 3.5 Haiku'}
                ],
                openai: [
                    {id: 'gpt-4o', name: 'GPT-4o'},
                    {id: 'gpt-4o-mini', name: 'GPT-4o Mini'},
                    {id: 'gpt-4-turbo', name: 'GPT-4 Turbo'},
                    {id: 'gpt-3.5-turbo', name: 'GPT-3.5 Turbo'}
                ],
                gemini: [
                    {id: 'gemini-2.5-pro', name: 'Gemini 2.5 Pro'},
                    {id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro'},
                    {id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash'}
                ],
                kimi: [
                    {id: 'kimi-k2-5', name: 'Kimi K2.5'},
                    {id: 'kimi-k1-5', name: 'Kimi K1.5'}
                ]
            };
            
            var modelList = models[provider] || models.claude;
            var html = '';
            
            for (var i = 0; i < modelList.length; i++) {
                var isSelected = (modelList[i].id === selectedModel) || (!selectedModel && i === 0);
                html += '<option value="' + modelList[i].id + '"' + (isSelected ? ' selected' : '') + '>';
                html += modelList[i].name;
                html += '</option>';
            }
            
            $('#model').html(html);
        }

        function loadAlexaInstances(selected) {
            console.log('loadAlexaInstances:', selected);
            
            socket.emit('getObjectView', 'system', 'instance', {
                startkey: 'system.adapter.alexa2.',
                endkey: 'system.adapter.alexa2.\u9999'
            }, function(err, res) {
                console.log('Alexa response:', err, res);
                
                var html = '';
                if (!err && res && res.rows && res.rows.length > 0) {
                    for (var i = 0; i < res.rows.length; i++) {
                        var inst = res.rows[i].id.replace('system.adapter.', '');
                        var isSelected = selected && selected.indexOf(inst) >= 0;
                        html += '<option value="' + inst + '"' + (isSelected ? ' selected' : '') + '>' + inst + '</option>';
                    }
                } else {
                    html = '<option value="alexa2.0" selected>alexa2.0</option>';
                }
                
                $('#alexa2Instances').html(html);
            });
        }

        function save(callback) {
            console.log('=== SAVE CALLED ===');
            
            var obj = {};
            obj.llmProvider = $('#llmProvider').val();
            obj.model = $('#model').val();
            obj.apiKey = $('#apiKey').val();
            obj.maxTokens = parseInt($('#maxTokens').val()) || 1024;
            obj.commandTimeout = parseInt($('#commandTimeout').val()) || 30;
            obj.deviceCacheMinutes = parseInt($('#deviceCacheMinutes').val()) || 5;
            obj.debounceMs = parseInt($('#debounceMs').val()) || 500;
            obj.confidenceThreshold = parseFloat($('#confidenceThreshold').val()) || 0.5;
            obj.allowedRooms = $('#allowedRooms').val() || '';
            obj.systemPrompt = $('#systemPrompt').val() || '';
            obj.confirmActions = $('#confirmActions').prop('checked');
            obj.alexa2Instances = $('#alexa2Instances').val() || ['alexa2.0'];
            
            var tw = $('#triggerWords').val();
            obj.triggerWords = tw ? tw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }) : [];

            console.log('Saving:', obj);
            callback(obj);
        }
    </script>
</head>
<body>
    <div class="m adapter-container">
        <div class="row">
            <div class="col s12">
                <h4>LLM Controller</h4>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>LLM Provider</h5>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m6">
                <label>Provider</label>
                <select id="llmProvider" class="value">
                    <option value="claude">Anthropic Claude</option>
                    <option value="openai">OpenAI (ChatGPT)</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="kimi">Kimi (Moonshot)</option>
                </select>
            </div>

            <div class="input-field col s12 m6">
                <label>Modell</label>
                <select id="model" class="value">
                    <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>API Konfiguration</h5>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m8">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" class="value">
            </div>

            <div class="input-field col s12 m4">
                <label for="maxTokens">Max Tokens</label>
                <input type="number" id="maxTokens" class="value" value="1024" min="256" max="4096">
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m4">
                <label for="commandTimeout">Timeout (Sek)</label>
                <input type="number" id="commandTimeout" class="value" value="30" min="5" max="120">
            </div>

            <div class="input-field col s12 m4">
                <label for="confidenceThreshold">Min. Konfidenz</label>
                <input type="number" id="confidenceThreshold" class="value" value="0.5" min="0" max="1" step="0.1">
            </div>

            <div class="input-field col s12 m4">
                <label for="debounceMs">Debounce (ms)</label>
                <input type="number" id="debounceMs" class="value" value="500" min="0" max="5000" step="100">
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>Alexa Integration</h5>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m6">
                <label>Alexa2 Instanzen (Strg+Klick für Mehrere)</label>
                <select id="alexa2Instances" class="value" multiple size="3">
                    <option value="alexa2.0">alexa2.0</option>
                </select>
            </div>

            <div class="input-field col s12 m6">
                <label for="triggerWords">Trigger-Wörter (kommagetrennt)</label>
                <input type="text" id="triggerWords" class="value">
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>Gerätesteuerung</h5>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m4">
                <label for="allowedRooms">Erlaubte Räume</label>
                <input type="text" id="allowedRooms" class="value">
            </div>

            <div class="input-field col s12 m4">
                <label for="deviceCacheMinutes">Cache (Min)</label>
                <input type="number" id="deviceCacheMinutes" class="value" value="5" min="1" max="60">
            </div>

            <div class="col s12 m4" style="padding-top: 30px;">
                <label>
                    <input type="checkbox" id="confirmActions" class="value filled-in">
                    <span>Konfidenz bestätigen</span>
                </label>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>System Prompt (Optional)</h5>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12">
                <label for="systemPrompt">Zusätzlicher Prompt</label>
                <textarea id="systemPrompt" class="value materialize-textarea"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
