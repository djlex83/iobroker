<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LLM Controller</title>
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>
    <script type="text/javascript" src="words.js"></script>
    <script type="text/javascript">
        var LLM_PROVIDERS = {
            claude: {
                name: 'Anthropic Claude',
                models: [
                    { id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4' },
                    { id: 'claude-opus-4-20250514', name: 'Claude Opus 4' },
                    { id: 'claude-3-5-haiku-20241022', name: 'Claude 3.5 Haiku' }
                ]
            },
            openai: {
                name: 'OpenAI (ChatGPT)',
                models: [
                    { id: 'gpt-4o', name: 'GPT-4o' },
                    { id: 'gpt-4o-mini', name: 'GPT-4o Mini' },
                    { id: 'gpt-4-turbo', name: 'GPT-4 Turbo' },
                    { id: 'gpt-3.5-turbo', name: 'GPT-3.5 Turbo' }
                ]
            },
            gemini: {
                name: 'Google Gemini',
                models: [
                    { id: 'gemini-2.5-pro', name: 'Gemini 2.5 Pro' },
                    { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro' },
                    { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash' }
                ]
            },
            kimi: {
                name: 'Kimi (Moonshot)',
                models: [
                    { id: 'kimi-k2-5', name: 'Kimi K2.5' },
                    { id: 'kimi-k1.5', name: 'Kimi K1.5' }
                ]
            }
        };

        function load(settings, onChange) {
            if (!settings) return;

            // Setze Standardwerte
            var provider = settings.llmProvider || 'claude';
            var model = settings.model || 'claude-sonnet-4-20250514';

            // ===== PROVIDER DROPDOWN =====
            var providerHtml = '';
            for (var key in LLM_PROVIDERS) {
                var sel = (key === provider) ? 'selected' : '';
                providerHtml += '<option value="' + key + '" ' + sel + '>' + LLM_PROVIDERS[key].name + '</option>';
            }
            document.getElementById('llmProvider').innerHTML = providerHtml;

            // ===== MODEL DROPDOWN =====
            updateModelSelect(provider, model);

            // ===== ALEXA INSTANCES =====
            loadAlexaInstances(settings.alexa2Instances || ['alexa2.0']);

            // ===== TEXT FIELDS =====
            document.getElementById('apiKey').value = settings.apiKey || '';
            document.getElementById('maxTokens').value = settings.maxTokens || 1024;
            document.getElementById('commandTimeout').value = settings.commandTimeout || 30;
            document.getElementById('confidenceThreshold').value = settings.confidenceThreshold || 0.5;
            document.getElementById('deviceCacheMinutes').value = settings.deviceCacheMinutes || 5;
            document.getElementById('debounceMs').value = settings.debounceMs || 500;
            document.getElementById('allowedRooms').value = settings.allowedRooms || '';
            document.getElementById('systemPrompt').value = settings.systemPrompt || '';
            document.getElementById('confirmActions').checked = settings.confirmActions || false;
            
            if (settings.triggerWords && Array.isArray(settings.triggerWords)) {
                document.getElementById('triggerWords').value = settings.triggerWords.join(', ');
            }

            // ===== EVENT HANDLER =====
            $('#llmProvider').on('change', function() {
                updateModelSelect($(this).val());
                onChange();
            });

            $('#model, #alexa2Instances').on('change', function() {
                onChange();
            });

            $('.value').on('change keyup', function() {
                onChange();
            });

            // Initialisiere Materialize
            $('select').formSelect();
            M.updateTextFields();

            onChange(false);
        }

        function updateModelSelect(provider, selectedModel) {
            var models = LLM_PROVIDERS[provider] ? LLM_PROVIDERS[provider].models : [];
            var html = '';
            for (var i = 0; i < models.length; i++) {
                var sel = (models[i].id === selectedModel || (!selectedModel && i === 0)) ? 'selected' : '';
                html += '<option value="' + models[i].id + '" ' + sel + '>' + models[i].name + '</option>';
            }
            var select = document.getElementById('model');
            select.innerHTML = html;
            
            // Re-initialize
            $(select).formSelect();
        }

        function loadAlexaInstances(selected) {
            socket.emit('getObjectView', 'system', 'instance', {
                startkey: 'system.adapter.alexa2.',
                endkey: 'system.adapter.alexa2.\u9999'
            }, function(err, res) {
                var html = '';
                if (!err && res && res.rows && res.rows.length > 0) {
                    for (var i = 0; i < res.rows.length; i++) {
                        var inst = res.rows[i].id.replace('system.adapter.', '');
                        var sel = selected.indexOf(inst) >= 0 ? 'selected' : '';
                        html += '<option value="' + inst + '" ' + sel + '>' + inst + '</option>';
                    }
                } else {
                    html = '<option value="alexa2.0" selected>alexa2.0</option>';
                }
                document.getElementById('alexa2Instances').innerHTML = html;
                $('#alexa2Instances').formSelect();
            });
        }

        function save(callback) {
            var obj = {};
            obj.llmProvider = $('#llmProvider').val();
            obj.model = $('#model').val();
            obj.apiKey = $('#apiKey').val();
            obj.maxTokens = parseInt($('#maxTokens').val()) || 1024;
            obj.commandTimeout = parseInt($('#commandTimeout').val()) || 30;
            obj.deviceCacheMinutes = parseInt($('#deviceCacheMinutes').val()) || 5;
            obj.debounceMs = parseInt($('#debounceMs').val()) || 500;
            obj.confidenceThreshold = parseFloat($('#confidenceThreshold').val()) || 0.5;
            obj.allowedRooms = $('#allowedRooms').val() || '';
            obj.systemPrompt = $('#systemPrompt').val() || '';
            obj.confirmActions = $('#confirmActions').prop('checked');
            obj.alexa2Instances = $('#alexa2Instances').val() || ['alexa2.0'];
            
            var tw = $('#triggerWords').val();
            obj.triggerWords = tw ? tw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }) : [];

            callback(obj);
        }
    </script>
</head>
<body>
    <div class="m adapter-container">
        <div class="row"><div class="col s12"><h4>LLM Controller</h4></div></div>

        <div class="row"><div class="col s12"><h5>LLM Provider</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12 m6">
                <select id="llmProvider" class="value"></select>
                <label>Provider</label>
            </div>
            <div class="input-field col s12 m6">
                <select id="model" class="value"></select>
                <label>Modell</label>
            </div>
        </div>

        <div class="row"><div class="col s12"><h5>API Konfiguration</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12 m8">
                <input type="password" id="apiKey" class="value">
                <label for="apiKey">API Key</label>
            </div>
            <div class="input-field col s12 m4">
                <input type="number" id="maxTokens" class="value" min="256" max="4096" value="1024">
                <label for="maxTokens">Max Tokens</label>
            </div>
        </div>

        <div class="row">
            <div class="input-field col s12 m4">
                <input type="number" id="commandTimeout" class="value" min="5" max="120" value="30">
                <label for="commandTimeout">Timeout (Sek)</label>
            </div>
            <div class="input-field col s12 m4">
                <input type="number" id="confidenceThreshold" class="value" min="0" max="1" step="0.1" value="0.5">
                <label for="confidenceThreshold">Min. Konfidenz</label>
            </div>
            <div class="input-field col s12 m4">
                <input type="number" id="debounceMs" class="value" min="0" max="5000" step="100" value="500">
                <label for="debounceMs">Debounce (ms)</label>
            </div>
        </div>

        <div class="row"><div class="col s12"><h5>Alexa Integration</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12 m6">
                <select id="alexa2Instances" class="value" multiple></select>
                <label>Alexa2 Instanzen</label>
            </div>
            <div class="input-field col s12 m6">
                <input type="text" id="triggerWords" class="value">
                <label for="triggerWords">Trigger-Wörter</label>
            </div>
        </div>

        <div class="row"><div class="col s12"><h5>Gerätesteuerung</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12 m4">
                <input type="text" id="allowedRooms" class="value">
                <label for="allowedRooms">Erlaubte Räume</label>
            </div>
            <div class="input-field col s12 m4">
                <input type="number" id="deviceCacheMinutes" class="value" min="1" max="60" value="5">
                <label for="deviceCacheMinutes">Cache (Min)</label>
            </div>
            <div class="col s12 m4" style="padding-top:25px">
                <label><input type="checkbox" id="confirmActions" class="value filled-in"><span>Konfidenz bestätigen</span></label>
            </div>
        </div>

        <div class="row"><div class="col s12"><h5>System Prompt (Optional)</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12">
                <textarea id="systemPrompt" class="value materialize-textarea"></textarea>
                <label for="systemPrompt">Zusätzlicher Prompt</label>
            </div>
        </div>

        <div class="row"><div class="col s12"><h5>Log</h5></div></div>
        
        <div class="row">
            <div class="input-field col s12">
                <textarea id="logView" readonly style="font-family:monospace;font-size:11px;background:#f5f5f5;min-height:150px" class="materialize-textarea"></textarea>
                <label class="active">Verarbeitungs-Log</label>
            </div>
            <div class="col s12">
                <a class="btn-small blue" onclick="refreshLog()">Aktualisieren</a>
                <a class="btn-small red" onclick="clearLog()">Leeren</a>
            </div>
        </div>

        <script>
            function refreshLog() {
                socket.emit('getState', 'llm-controller.0.log', function(err, state) {
                    var el = document.getElementById('logView');
                    if (state && state.val) {
                        try {
                            var logs = JSON.parse(state.val);
                            el.value = logs.slice(-30).join('\n');
                        } catch(e) { el.value = 'Fehler: ' + e.message; }
                    } else { el.value = 'Keine Logs.'; }
                    M.textareaAutoResize($(el));
                });
            }
            function clearLog() {
                socket.emit('setState', 'llm-controller.0.log', JSON.stringify([]));
                document.getElementById('logView').value = '';
            }
            setInterval(refreshLog, 3000);
        </script>
    </div>
</body>
</html>
